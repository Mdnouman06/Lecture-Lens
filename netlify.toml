# ==============================================================================
# LectureLens Netlify Production Deployment Configuration
# ==============================================================================
# Single-Page Application (SPA) static deployment settings.
# Notice: Netlify hosts only the static compiled frontend client.
# All Python, faster-whisper, and Ollama ML engines run on the student's hardware.

[build]
  publish = "dist"
  command = "npm run build"

# Single-Page Application (SPA) client-side routing fallback.
# Matches public/_redirects (/* /index.html 200) without conflict.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
